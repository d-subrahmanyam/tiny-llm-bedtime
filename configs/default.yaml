seed: 42
device: auto

data:
  dataset_name: "gofilipa/bedtime_stories"
  split: "train"
  text_field: "stories"
  max_samples: 50000
  val_ratio: 0.05
  vocab_size: 4096
  min_frequency: 2
  tokenizer_path: "tokenizer.json"

model:
  block_size: 192
  n_layer: 6
  n_head: 6
  n_embd: 384
  dropout: 0.15
  bias: false

training:
  batch_size: 16
  learning_rate: 0.00025
  weight_decay: 0.1
  betas: [0.9, 0.95]
  max_steps: 5000
  eval_interval: 200
  eval_iters: 50
  gradient_clip: 1.0
  checkpoint_dir: "checkpoints"
  checkpoint_every: 1000
  log_every: 20
  preview_tokens: 150
